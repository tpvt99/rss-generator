name: Update Blog Feeds
 
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours, UTC (GitHub may delay this slightly under load)
  workflow_dispatch: {}      # adds a manual "Run workflow" button in the Actions tab
 
permissions:
  contents: write
 
jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - run: pip install requests beautifulsoup4 feedgen
 
      - run: python generate_feeds.py
 
      - name: Record that we checked (keeps the schedule from ever going idle)
        run: date -u +"Last checked: %Y-%m-%dT%H:%M:%SZ" > last-checked.txt
 
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml last-checked.txt
          git diff --quiet --cached || git commit -m "Update feeds"
          git push